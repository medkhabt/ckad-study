---
apiVersion: v1
kind: Pod
metadata:
  name: data-exchange
  namespace: ckad
spec:
  volumes:
    - name: ev-data
      emptyDir: {}
  containers:
    - image: busybox:1.36.1
      name: main-app
      command: ['/bin/sh', '-c', 'mkdir -p /var/app/data; counter=1; while true; do touch "/var/app/data/${counter}-data.txt"; counter=$((counter + 1)); sleep 30; done']
      volumeMounts:
        - mountPath: /var/app/data
          name: ev-data
    - image: busybox:1.36.1
      name: sidecar
      command: ['/bin/sh', '-c', 'while true; do ls /var/app/data | wc -l; sleep 60; done']
      volumeMounts:
        - mountPath: /var/app/data
          name: ev-data
