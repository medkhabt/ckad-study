---
apiVersion: v1
kind: Pod
metadata:
  name: complex-pod
  namespace: ckad
spec:
  initContainers:
    - name: setup
      image: busybox:1.36.1
      command: ['/bin/sh', '-c', 'wget -O- google.com']
  containers:
    - image: nginx:1.25.1
      name: complex-pod
      ports:
        - containerPort: 80
